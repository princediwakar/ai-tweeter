name: Content Generation - Gibbi

on:
  schedule:
    - cron: '35 * * * *'  # Every hour at 30 minutes past

jobs:
  generate-gibbi:
    name: Generate Content for @gibbi_ai
    runs-on: ubuntu-latest
    steps:
      - name: Generate content for @gibbi_ai
        run: |
          curl -X GET "${{ secrets.VERCEL_URL }}/api/generate?twitter_handle=@gibbi_ai&source=github-actions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"