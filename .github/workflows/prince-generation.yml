name: Prince Generation

on:
  schedule:
    - cron: '0 * * * *'  # Every hour

jobs:
  generate:
    name: Generate Content for @princediwakar25
    runs-on: ubuntu-latest
    steps:
      - name: Generate content for @princediwakar25
        run: |
          curl -X GET "${{ secrets.VERCEL_URL }}/api/generate?twitter_handle=%40princediwakar25&source=github-actions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
