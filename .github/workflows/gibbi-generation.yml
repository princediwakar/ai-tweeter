name: Gibbi Generation

on:
  schedule:
    - cron: '0 * * * *'  # Every hour

jobs:
  generate:
    name: Generate Content for @gibbi_ai
    runs-on: ubuntu-latest
    steps:
      - name: Generate content for @gibbi_ai
        run: |
          curl -X GET "${{ secrets.VERCEL_URL }}/api/generate?twitter_handle=%40gibbi_ai&source=github-actions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
