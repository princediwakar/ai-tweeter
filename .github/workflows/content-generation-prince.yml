name: Content Generation - Prince

on:
  schedule:
    - cron: '35 * * * *'  # Every hour at 35 minutes past (5 min after Gibbi)

jobs:
  generate-prince:
    name: Generate Content for @princediwakar25
    runs-on: ubuntu-latest
    steps:
      - name: Generate content for @princediwakar25
        run: |
          curl -X GET "${{ secrets.VERCEL_URL }}/api/generate?twitter_handle=@princediwakar25&source=github-actions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"